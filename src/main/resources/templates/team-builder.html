<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Team Builder</title>


<style>


body{

font-family:Arial;
background:#f2f2f2;

}


.container{

width:95%;
margin:auto;

}



.box{

background:white;
padding:20px;
margin-bottom:20px;
border-radius:8px;

}



table{

width:100%;
border-collapse:collapse;

}



th{

background:#222;
color:white;
padding:8px;

}



td{

padding:8px;
text-align:center;
border-bottom:1px solid #ddd;

}



button,a{

padding:6px 10px;
border-radius:4px;
text-decoration:none;

}



.remove{

background:#d32f2f;
color:white;

}



.module{

background:#1976d2;
color:white;

}



.slot{

background:#eee;
font-weight:bold;

}



</style>


</head>



<body>



<div class="container">



<h1>
Team Builder
</h1>







<!-- ==========================
     MODULI
========================== -->


<div class="box">


<h2>
Formazione Mantra
</h2>



<form method="get"
action="/team-builder">



<select name="module">


<option
th:each="m:${availableModules}"

th:value="${m}"

th:text="${m}"

th:selected="${m==selectedModule}">

</option>



</select>



<button class="module">

Cambia

</button>



</form>



</div>









<!-- ==========================
     ROSA CLASSIC
========================== -->


<div class="box">


<h2>
Rosa Classic
</h2>



<table>


<thead>

<tr>

<th>
Nome
</th>

<th>
Squadra
</th>

<th>
Ruolo
</th>

<th>
Costo
</th>

<th>
Rimuovi
</th>


</tr>


</thead>




<tbody>


<tr th:each="g:${rosaClassic}">


<td th:text="${g.giocatore.nome}">
</td>


<td th:text="${g.giocatore.squadra}">
</td>


<td th:text="${g.giocatore.ruolo}">
</td>


<td th:text="${g.prezzo}">
</td>



<td>


<a class="remove"

th:href="@{/rimuovi-classic(id=${g.giocatore.id})}">

X

</a>


</td>


</tr>


</tbody>


</table>



</div>









<!-- ==========================
     ROSA MANTRA
========================== -->


<div class="box">


<h2>
Rosa Mantra
</h2>




<table>


<thead>

<tr>

<th>
Nome
</th>


<th>
Squadra
</th>


<th>
Ruolo Mantra
</th>


<th>
Costo
</th>


<th>
Rimuovi
</th>


</tr>


</thead>



<tbody>


<tr th:each="g:${rosaMantra}">


<td th:text="${g.giocatore.nome}">
</td>


<td th:text="${g.giocatore.squadra}">
</td>


<td th:text="${g.giocatore.ruoloMantra}">
</td>


<td th:text="${g.prezzo}">
</td>



<td>


<a class="remove"

th:href="@{/rimuovi-mantra(id=${g.giocatore.id})}">

X

</a>


</td>


</tr>


</tbody>



</table>



</div>









<!-- ==========================
     FORMAZIONE
========================== -->


<div class="box">


<h2>
Formazione titolare Mantra
</h2>



<table>


<thead>


<tr>

<th>
Slot
</th>


<th>
Giocatore
</th>


<th>
Ruolo
</th>


<th>
Squadra
</th>


</tr>


</thead>



<tbody>


<tr th:each="slot:${lineupMantra}">



<td class="slot"

th:text="${slot.slot}">

</td>




<td>


<span th:if="${slot.giocatore!=null}"

th:text="${slot.giocatore.nome}">

</span>



<span th:if="${slot.giocatore==null}">

--

</span>


</td>





<td>


<span th:if="${slot.giocatore!=null}"

th:text="${slot.giocatore.ruoloMantra}">

</span>


</td>






<td>


<span th:if="${slot.giocatore!=null}"

th:text="${slot.giocatore.squadra}">

</span>


</td>



</tr>


</tbody>



</table>


</div>






<a href="/">

← Torna al listone

</a>



</div>


</body>

</html>
