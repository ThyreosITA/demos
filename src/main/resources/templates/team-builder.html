<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <title>Mantra Team Builder</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .football-pitch {
            width: 100%;
            max-width: 500px;
            height: 720px;
            background: linear-gradient(180deg, #2e7d32 0%, #388e3c 100%);
            border: 4px solid #ffffff;
            border-radius: 12px;
            position: relative;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 15px 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .football-pitch::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 110px;
            height: 110px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            pointer-events: none;
        }
        .midfield-line {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.3);
            pointer-events: none;
        }
        .pitch-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            z-index: 2;
            width: 100%;
        }
        .player-slot {
            background: rgba(0, 0, 0, 0.6);
            border: 2px dashed rgba(255, 255, 255, 0.7);
            border-radius: 8px;
            width: 70px;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            text-align: center;
            padding: 4px;
        }
        .player-slot:hover {
            background: rgba(0, 0, 0, 0.8);
            border-color: #ffc107;
            transform: scale(1.05);
        }
        .slot-role {
            font-size: 0.70rem;
            font-weight: bold;
            color: #ffc107;
        }
        .slot-name {
            font-size: 0.60rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            color: #fff;
        }
        .controls-panel {
            background: #1e1e1e;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            height: 100%;
        }
        .bench-slot {
            background: rgba(0, 0, 0, 0.5);
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            min-height: 42px;
        }
        .bench-slot:hover {
            background: rgba(0, 0, 0, 0.8);
            border-color: #ffc107;
        }
    </style>
</head>
<body>

<div class="container-fluid my-4 px-4">
    <!-- Intestazione con Titolo a sinistra e Pulsanti in alto a destra -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="m-0">Mantra Team Builder</h2>
        <div class="d-flex gap-2">
            <!-- Tasto Importa Quotazioni (collegamento alla pagina) -->
            <a href="/importa-quotazioni" class="btn btn-info btn-sm fw-bold">
                Importa quotazioni
            </a>
            
            <!-- Tasto Listone -->
            <a href="/" class="btn btn-outline-light btn-sm fw-bold">
                📋 Listone
            </a>
        </div>
    </div>
    
    <div class="row">
        <!-- COLONNA SINISTRA: Panchina -->
        <div class="col-md-3 mb-4">
            <div class="controls-panel">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="m-0 fw-bold">Panchina (<span id="benchCountText">0</span>/14)</h5>
                    <button class="btn btn-sm btn-success fw-bold" onclick="aggiungiCasellaPanchina()">+ Aggiungi</button>
                </div>
                <div id="benchContainer" class="d-flex flex-column gap-2" style="max-height: 650px; overflow-y: auto;">
                    <!-- Slot panchina dinamici -->
                </div>
            </div>
        </div>

        <!-- COLONNA CENTRALE: Campo da calcio -->
        <div class="col-md-6 mb-4">
            <div class="football-pitch" id="pitchContainer">
                <div class="midfield-line"></div>
            </div>
        </div>

        <!-- COLONNA DESTRA: Controlli e Budget -->
        <div class="col-md-3 mb-4">
            <div class="controls-panel">
                <label for="moduloSelect" class="form-label fw-bold">Modulo Mantra:</label>
                <select id="moduloSelect" class="form-select bg-dark text-light border-secondary mb-3" onchange="cambiaModulo()">
                    <option value="352">3-5-2</option>
                    <option value="4312">4-3-1-2</option>
                    <option value="4231">4-2-3-1</option>
                    <option value="3412">3-4-1-2</option>
                    <option value="433">4-3-3</option>
                </select>

                <div class="mb-3">
                    <label for="budgetTotalInput" class="form-label fw-bold">Budget Totale:</label>
                    <input type="number" id="budgetTotalInput" class="form-control bg-dark text-light border-secondary" value="500" oninput="aggiornaBudget()">
                </div>

                <div class="budget-info mb-3">
                    <p class="mb-1">Crediti Residui: <span class="badge bg-success" id="creditiResidui">500 / 500</span></p>
                    <p class="mb-0">Titolari Schierati: <span class="badge bg-info" id="titolariCount">0 / 11</span></p>
                </div>
                <button class="btn btn-warning w-100 fw-bold">Salva Formazione</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal di Selezione Giocatore -->
<div class="modal fade" id="playerModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-dark text-light border-secondary">
      <div class="modal-header border-secondary">
        <h5 class="modal-title">Seleziona Giocatore: <span id="modalRoleTitle" class="text-warning"></span></h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="text" id="searchPlayer" class="form-control bg-black text-light border-secondary mb-3" placeholder="Cerca giocatore o squadra..." oninput="filtraListaTesto()">
        <div class="list-group" id="playerListContainer" style="max-height: 300px; overflow-y: auto;">
          <!-- Lista dinamica -->
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script th:inline="none">
    let giocatoriDisponibili = [];
    let ruoloAttivoCorrente = "";
    let slotCorrenteAttivo = null;
    const MAX_BENCH = 14;

    window.onload = () => {
        fetch('/api/giocatori')
            .then(response => response.json())
            .then(data => {
                giocatoriDisponibili = data;
                console.log("Giocatori caricati dal database:", giocatoriDisponibili.length);
                renderCampo('352');
            })
            .catch(error => console.error('Errore nel recupero dei giocatori:', error));
    };

    const moduliMantra = {
        "352": [["Por"], ["Dd", "Dc", "Ds"], ["M", "C", "C", "C", "W"], ["Pc", "A"]],
        "4312": [["Por"], ["Dd", "Dc", "Dc", "Ds"], ["M", "C", "C"], ["T"], ["Pc", "A"]],
        "4231": [["Por"], ["Dd", "Dc", "Dc", "Ds"], ["M", "M"], ["W", "T", "W"], ["Pc"]],
        "3412": [["Por"], ["Dd", "Dc", "Ds"], ["M", "C", "C", "W"], ["T"], ["Pc", "A"]],
        "433": [["Por"], ["Dd", "Dc", "Dc", "Ds"], ["M", "C", "C"], ["W", "Pc", "W"]]
    };

    function renderCampo(modulo) {
        const container = document.getElementById('pitchContainer');
        container.innerHTML = '<div class="midfield-line"></div>';
        
        const righe = moduliMantra[modulo] || moduliMantra["352"];

        righe.forEach(reparto => {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'pitch-row';
            
            reparto.forEach(ruolo => {
                const slot = document.createElement('div');
                slot.className = 'player-slot';
                slot.dataset.slotRole = ruolo;
                slot.innerHTML = `
                    <span class="slot-role">${ruolo}</span>
                    <span class="slot-name">Vuoto</span>
                `;
                
                slot.addEventListener('click', () => {
                    if (slot.dataset.playerId) {
                        rimuoviGiocatoreDaSlot(slot);
                    } else {
                        apriModaleGiocatori(ruolo, slot);
                    }
                });

                rowDiv.appendChild(slot);
            });
            container.appendChild(rowDiv);
        });
        aggiornaConteggioTitolari();
        aggiornaBudget();
    }

    function cambiaModulo() {
        const moduloSelezionato = document.getElementById('moduloSelect').value;
        renderCampo(moduloSelezionato);
    }

    function aggiungiCasellaPanchina() {
        const container = document.getElementById('benchContainer');
        if (container.children.length >= MAX_BENCH) {
            alert("Hai raggiunto il limite massimo di 14 panchinari.");
            return;
        }
        
        const index = container.children.length + 1;
        const slot = document.createElement('div');
        slot.className = 'bench-slot';
        slot.dataset.slotRole = 'TUTTI';
        slot.innerHTML = `
            <div class="d-flex align-items-center overflow-hidden">
                <span class="badge bg-secondary me-2">P${index}</span>
                <span class="slot-name text-muted">Vuoto</span>
            </div>
            <span class="slot-price text-warning fs-6 ms-2"></span>
        `;
        
        slot.addEventListener('click', () => {
            if (slot.dataset.playerId) {
                rimuoviGiocatoreDaSlot(slot);
            } else {
                apriModaleGiocatori('TUTTI', slot);
            }
        });

        container.appendChild(slot);
        document.getElementById('benchCountText').innerText = container.children.length;
    }

    function rimuoviGiocatoreDaSlot(slot) {
        delete slot.dataset.playerId;
        delete slot.dataset.playerPrice;

        if (slot.classList.contains('bench-slot')) {
            const badgeNum = slot.querySelector('.badge').outerHTML;
            slot.querySelector('.slot-name').innerHTML = `${badgeNum} <span class="text-muted">Vuoto</span>`;
            slot.querySelector('.slot-name').className = "slot-name";
            slot.querySelector('.slot-price').innerText = "";
            slot.style.borderColor = 'rgba(255, 255, 255, 0.4)';
            slot.style.background = 'rgba(0, 0, 0, 0.5)';
        } else {
            const ruolo = slot.dataset.slotRole;
            slot.innerHTML = `
                <span class="slot-role">${ruolo}</span>
                <span class="slot-name">Vuoto</span>
            `;
            slot.style.borderColor = 'rgba(255, 255, 255, 0.7)';
            slot.style.background = 'rgba(0, 0, 0, 0.6)';
            aggiornaConteggioTitolari();
        }
        aggiornaBudget();
    }

    function apriModaleGiocatori(ruoloRichiesto, slotElement) {
        ruoloAttivoCorrente = ruoloRichiesto;
        slotCorrenteAttivo = slotElement;
        document.getElementById('modalRoleTitle').innerText = ruoloRichiesto === 'TUTTI' ? 'Tutti i Ruoli (Panchina)' : ruoloRichiesto;
        document.getElementById('searchPlayer').value = '';
        
        popolaListaGiocatori(ruoloRichiesto);

        const modal = new bootstrap.Modal(document.getElementById('playerModal'));
        modal.show();
    }

    function getSelectedPlayerIds() {
        const selectedIds = new Set();
        document.querySelectorAll('.player-slot, .bench-slot').forEach(slot => {
            if (slot.dataset.playerId) {
                selectedIds.add(Number(slot.dataset.playerId));
            }
        });
        return selectedIds;
    }

    function popolaListaGiocatori(ruolo) {
        const listaContainer = document.getElementById('playerListContainer');
        listaContainer.innerHTML = '';

        const selectedIds = getSelectedPlayerIds();
        const currentSlotPlayerId = slotCorrenteAttivo.dataset.playerId ? Number(slotCorrenteAttivo.dataset.playerId) : null;

        const filtrati = giocatoriDisponibili.filter(g => {
            if (selectedIds.has(g.id) && g.id !== currentSlotPlayerId) {
                return false;
            }

            if (ruolo === 'TUTTI') return true;

            const stringaRuoli = g.ruoloMantra || g.ruolo;
            if (!stringaRuoli) return false;
            const ruoliGiocatore = stringaRuoli.toLowerCase().split(/[,\/]/).map(r => r.trim());
            return ruoliGiocatore.includes(ruolo.toLowerCase());
        });

        if (filtrati.length === 0) {
            listaContainer.innerHTML = `<div class="text-center text-muted p-3">Nessun giocatore disponibile trovato</div>`;
            return;
        }

        renderizzaElementiLista(filtrati);
    }

    function renderizzaElementiLista(arrayGiocatori) {
        const listaContainer = document.getElementById('playerListContainer');
        listaContainer.innerHTML = '';

        arrayGiocatori.forEach(g => {
            const nomeGiocatore = g.nome || g.nomeGiocatore || "Sconosciuto";
            const squadraGiocatore = g.squadra || "N/D";
            const ruoliMantraGiocatore = g.ruoloMantra || g.ruolo || "N/D";
            const quotazioneConsigliata = g.quotazioneMantra || g.quotazione || 1;

            const item = document.createElement('button');
            item.type = 'button';
            item.className = 'list-group-item list-group-item-action bg-dark text-light border-secondary d-flex justify-content-between align-items-center';
            item.innerHTML = `
                <div>
                    <strong>${nomeGiocatore}</strong> <small class="text-muted">(${squadraGiocatore} - ${ruoliMantraGiocatore})</small>
                </div>
                <span class="badge bg-warning text-dark">${quotazioneConsigliata} cr</span>
            `;
            item.addEventListener('click', () => {
                let prezzoInput = prompt(`Inserisci il prezzo pagato per ${nomeGiocatore} (Quotazione consigliata: ${quotazioneConsigliata} cr):`, quotazioneConsigliata);
                
                if (prezzoInput === null) return;
                let prezzoPagato = parseInt(prezzoInput);
                if (isNaN(prezzoPagato) || prezzoPagato < 0) prezzoPagato = 0;

                slotCorrenteAttivo.dataset.playerId = g.id;
                slotCorrenteAttivo.dataset.playerPrice = prezzoPagato;
                
                if (slotCorrenteAttivo.classList.contains('bench-slot')) {
                    const badgeNum = slotCorrenteAttivo.querySelector('.badge').outerHTML;
                    slotCorrenteAttivo.querySelector('.slot-name').innerHTML = `${badgeNum} <strong>${nomeGiocatore}</strong> <small class="text-muted">(${ruoliMantraGiocatore})</small>`;
                    slotCorrenteAttivo.querySelector('.slot-name').className = "slot-name text-light";
                    slotCorrenteAttivo.querySelector('.slot-price').innerText = `${prezzoPagato} cr`;
                    slotCorrenteAttivo.style.borderColor = '#28a745';
                    slotCorrenteAttivo.style.background = 'rgba(0, 50, 0, 0.6)';
                } else {
                    slotCorrenteAttivo.querySelector('.slot-name').innerHTML = `
                        ${nomeGiocatore}<br>
                        <span style="color: #ffc107; font-weight: bold;">${prezzoPagato} cr</span>
                    `;
                    slotCorrenteAttivo.style.borderColor = '#28a745';
                    slotCorrenteAttivo.style.background = 'rgba(0, 50, 0, 0.6)';
                }
                
                const modalEl = document.getElementById('playerModal');
                const modal = bootstrap.Modal.getInstance(modalEl);
                modal.hide();

                aggiornaConteggioTitolari();
                aggiornaBudget();
            });
            listaContainer.appendChild(item);
        });
    }

    function filtraListaTesto() {
        const testo = document.getElementById('searchPlayer').value.toLowerCase();
        const selectedIds = getSelectedPlayerIds();
        const currentSlotPlayerId = slotCorrenteAttivo.dataset.playerId ? Number(slotCorrenteAttivo.dataset.playerId) : null;
        
        const filtrati = giocatoriDisponibili.filter(g => {
            if (selectedIds.has(g.id) && g.id !== currentSlotPlayerId) {
                return false;
            }

            if (ruoloAttivoCorrente !== 'TUTTI') {
                const stringaRuoli = g.ruoloMantra || g.ruolo;
                if (!stringaRuoli) return false;
                const ruoliGiocatore = stringaRuoli.toLowerCase().split(/[,\/]/).map(r => r.trim());
                if (!ruoliGiocatore.includes(ruoloAttivoCorrente.toLowerCase())) return false;
            }
            
            const nomeMatch = (g.nome || g.nomeGiocatore || "").toLowerCase().includes(testo);
            const squadraMatch = (g.squadra || "").toLowerCase().includes(testo);
            
            return nomeMatch || squadraMatch;
        });

        renderizzaElementiLista(filtrati);
    }

    function aggiornaConteggioTitolari() {
        const slots = document.querySelectorAll('.football-pitch .player-slot');
        let occupati = 0;
        slots.forEach(s => {
            if (s.dataset.playerId) {
                occupati++;
            }
        });
        document.getElementById('titolariCount').innerText = `${occupati} / ${slots.length}`;
    }

    function aggiornaBudget() {
        const budgetTotale = parseInt(document.getElementById('budgetTotalInput').value) || 0;
        let spesaTotale = 0;

        document.querySelectorAll('.player-slot, .bench-slot').forEach(slot => {
            if (slot.dataset.playerPrice) {
                spesaTotale += parseInt(slot.dataset.playerPrice) || 0;
            }
        });

        const residuo = budgetTotale - spesaTotale;
        const badgeResiduo = document.getElementById('creditiResidui');
        badgeResiduo.innerText = `${residuo} / ${budgetTotale}`;

        if (residuo < 0) {
            badgeResiduo.className = "badge bg-danger";
        } else {
            badgeResiduo.className = "badge bg-success";
        }
    }
</script>

</body>
</html>
